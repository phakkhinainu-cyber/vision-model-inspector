[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-model-inspector"
version = "0.1.0"
description = "Desktop tool to inspect YOLO detection models: images, video, cameras and Grad-CAM (Thai UI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "numpy>=1.26,<3", "opencv-python>=4.9,<5", "PyYAML>=6.0", "PySide6>=6.7,<6.10",
  "onnxruntime>=1.18,<2", "torch>=2.3,<2.9", "torchvision>=0.18,<0.24", "ultralytics>=8.3.0,<8.4",
]

[project.gui-scripts]
vision-model-inspector = "vmi.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vmi = ["resources/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
