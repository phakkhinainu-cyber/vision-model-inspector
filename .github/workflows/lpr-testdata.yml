name: lpr-testdata

# ภาพทดสอบ (CC BY 4.0) + สำรวจโมเดลป้ายไทย -> release "lpr-testdata-v1" (ใช้ทดสอบเท่านั้น ไม่รวมในตัวติดตั้ง)
on:
  push:
    paths: ["lpr/tools/models/fetch_testdata.py", ".github/workflows/lpr-testdata.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  TAG: lpr-testdata-v1

jobs:
  testdata:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install "ultralytics>=8.3,<8.4" onnx onnxslim onnxruntime huggingface_hub
      - name: Fetch
        run: |
          python lpr/tools/models/fetch_testdata.py --out out_testdata 2>&1 | tee out_testdata.log
          test "${PIPESTATUS[0]}" = "0"
          mv out_testdata.log out_testdata/fetch.log
          ls -la out_testdata
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$TAG" -y --cleanup-tag || true
          gh release create "$TAG" out_testdata/* --target "$GITHUB_SHA" --prerelease \
            --title "LPR test data v1" \
            --notes "ภาพทดสอบจาก keremberke/license-plate-object-detection (CC BY 4.0) สำหรับทดสอบเท่านั้น"
