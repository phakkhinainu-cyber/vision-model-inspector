name: lpr-models

# สร้างไฟล์โมเดล ONNX ของโปรแกรมตรวจป้ายทะเบียน (LPR) แล้วเผยแพร่เป็น release "lpr-models-v1"
on:
  push:
    paths: ["lpr/tools/models/**", ".github/workflows/lpr-models.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  MODELS_TAG: lpr-models-v1

jobs:
  models:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install toolchain
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install "ultralytics>=8.3,<8.4" onnx onnxslim onnxruntime huggingface_hub pyyaml pillow opencv-python-headless
          pip install "paddlepaddle>=3.0,<3.3" "paddleocr>=3.1" paddle2onnx
          pip list | grep -i -E "paddle|onnx|ultra|torch"
      - name: Build models
        run: |
          python lpr/tools/models/build_models.py --out out_models --testdata out_testdata 2>&1 | tee build_models.log
          test "${PIPESTATUS[0]}" = "0"
          ls -la out_models out_testdata || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lpr-testdata
          path: |
            out_testdata
            build_models.log
          retention-days: 14
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build_models.log out_models/
          gh release delete "$MODELS_TAG" -y --cleanup-tag || true
          gh release create "$MODELS_TAG" out_models/* --target "$GITHUB_SHA" --prerelease \
            --title "LPR models v1 (ONNX)" \
            --notes "ไฟล์โมเดล ONNX สำหรับโปรแกรมตรวจป้ายทะเบียน (สร้างโดย CI จาก ${GITHUB_SHA}). ไลเซนส์ของแต่ละโมเดลอยู่ใน manifest.json"
