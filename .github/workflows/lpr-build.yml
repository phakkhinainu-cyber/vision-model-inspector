name: lpr-build

# สร้างโปรแกรมสำเร็จรูป LPR บ้าน:
#   Windows x64: ตัวติดตั้ง + แบบพกพา 2 รุ่น — รุ่นปกติ (CPU, ใช้ได้ทุกเครื่อง) และรุ่น GPU (DirectML: การ์ดจอ NVIDIA/AMD/Intel)
#   แบบพกพา: Linux x64, Linux ARM64, macOS Apple Silicon, macOS Intel
# ทดสอบ: unit test, self-test ของไฟล์ที่ build แล้ว, ติดตั้งจริงเป็น Windows service แล้วเรียก API, ถอนการติดตั้ง
# เผยแพร่: release ตามเลข build + release "lpr-latest" ที่ลิงก์ดาวน์โหลดไม่เปลี่ยน
on:
  push:
    paths: ["lpr/**", ".github/workflows/lpr-build.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  APP_VERSION: "1.0.0"

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: cpu
            suffix: ""
            ort: ""
          - edition: gpu
            suffix: "-GPU"
            ort: "onnxruntime-directml"
    name: windows (${{ matrix.edition }})
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
        working-directory: lpr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Frontend
        working-directory: lpr/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Python dependencies
        run: |
          New-Item -ItemType Directory -Force ci_results | Out-Null
          python -m pip install --upgrade pip
          pip install -r requirements/runtime.txt -r requirements/desktop.txt -r requirements/dev.txt
          if ("${{ matrix.ort }}" -ne "") {
            pip uninstall -y onnxruntime
            pip install "${{ matrix.ort }}"
          }
          pip freeze | Out-File -Encoding utf8 ci_results/lock-windows-${{ matrix.edition }}.txt
          python -c "import onnxruntime, cv2, fastapi, webview; print('ort', onnxruntime.__version__, onnxruntime.get_available_providers(), 'cv2', cv2.__version__, 'fastapi', fastapi.__version__)" | Tee-Object ci_results/versions.txt
      - name: Models
        run: python tools/fetch_models.py
      - name: Unit + integration tests
        run: |
          python -m pytest -q -p no:cacheprovider *> ci_results/pytest.txt
          $code = $LASTEXITCODE
          Get-Content ci_results/pytest.txt -Tail 25
          if ($code -ne 0) { exit $code }
      - name: Third-party notices
        run: |
          pip-licenses --from=mixed --format=plain-vertical --with-license-file --no-license-path --with-urls --output-file THIRD_PARTY_NOTICES.txt
          Add-Content THIRD_PARTY_NOTICES.txt "`n`n=== Fonts: Anuphan, Sarabun, JetBrains Mono — SIL Open Font License 1.1 ===`n"
          Get-Content backend/lpr/resources/fonts/Sarabun-OFL.txt | Add-Content THIRD_PARTY_NOTICES.txt
          Add-Content THIRD_PARTY_NOTICES.txt "`n=== Models ===`nYOLO11n (Ultralytics) AGPL-3.0; license-plate-finetune-v1n (morsetechlab) AGPL-3.0; PaddleOCR PP-OCRv5 th_PP-OCRv5_mobile_rec / PP-OCRv5_mobile_det Apache-2.0`n=== WinSW === MIT`n"
          pip-licenses --from=mixed --format=markdown --with-urls | Out-File -Encoding utf8 ci_results/licenses_python.md
      - name: PyInstaller
        run: |
          pyinstaller --noconfirm --clean packaging/lpr.spec *> ci_results/pyinstaller.txt
          if ($LASTEXITCODE -ne 0) { Get-Content ci_results/pyinstaller.txt -Tail 60; exit 1 }
          "onedir MB: {0:N0}" -f ((Get-ChildItem dist/LPR -Recurse | Measure-Object Length -Sum).Sum / 1MB) | Tee-Object ci_results/sizes.txt
      - name: Self-test frozen build (Thai path)
        run: |
          $h = "C:\ทดสอบ LPR"
          $p = Start-Process dist\LPR\LPR.exe -ArgumentList @("--selftest", "`"$pwd\ci_results\selftest_frozen.json`"", "--home", "`"$h`"") -Wait -PassThru
          "frozen selftest exit: $($p.ExitCode)" | Tee-Object ci_results/selftest_summary.txt
          Get-Content ci_results\selftest_frozen.json -Encoding utf8 | Select-Object -First 60
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Inno Setup installer
        run: |
          curl.exe -sSL --retry 3 -o packaging\WinSW-x64.exe https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $defs = @("/DAppVersion=$env:APP_VERSION")
          if ("${{ matrix.suffix }}" -ne "") { $defs += "/DEdition=GPU" }
          & $iscc /Qp @defs packaging\installer.iss *> ci_results/iscc.txt
          if ($LASTEXITCODE -ne 0) { Get-Content ci_results/iscc.txt -Tail 40; exit 1 }
          Compress-Archive -Path dist\LPR -DestinationPath "Output\LPR-Portable-$env:APP_VERSION-windows-x64${{ matrix.suffix }}.zip"
          Get-ChildItem Output | Format-Table Name, Length -AutoSize | Out-File -Append -Encoding utf8 ci_results/sizes.txt
          Get-FileHash Output\* -Algorithm SHA256 | Format-List | Out-File -Append -Encoding utf8 ci_results/sizes.txt
      - name: Install as Windows service, use it through the API, uninstall
        run: |
          $setup = (Get-ChildItem Output\LPR-Setup-*.exe)[0].FullName
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DATADIR=C:\LPRdata','/LOG=C:\lpr-install.log' -Wait -PassThru
          "install exit: $($p.ExitCode)" | Tee-Object ci_results/installer_test.txt
          Start-Sleep 5
          (Get-Service LPRService | Format-List Name,Status,StartType | Out-String) | Tee-Object -Append ci_results/installer_test.txt
          "home pointer: $(Get-Content C:\ProgramData\LPR\home.txt)" | Tee-Object -Append ci_results/installer_test.txt
          "firewall rule: $((Get-NetFirewallRule -DisplayName 'LPR-ban LAN' -ErrorAction SilentlyContinue).Profile)" | Tee-Object -Append ci_results/installer_test.txt
          python tools/ci_service_check.py ci_results/service_check.json --wait 240
          $chk = $LASTEXITCODE
          "service check exit: $chk" | Tee-Object -Append ci_results/installer_test.txt
          "db exists: $(Test-Path C:\LPRdata\data\lpr.db)" | Tee-Object -Append ci_results/installer_test.txt
          Copy-Item C:\LPRdata\logs\lpr.log ci_results\service_lpr.log -ErrorAction SilentlyContinue
          Copy-Item C:\lpr-install.log ci_results\ -ErrorAction SilentlyContinue
          Get-ChildItem C:\ProgramData\LPR\service-logs -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName ci_results\ }
          $u = Start-Process "C:\Program Files\LPR\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          Start-Sleep 5
          "uninstall exit: $($u.ExitCode); service removed: $((Get-Service LPRService -ErrorAction SilentlyContinue) -eq $null); data kept: $(Test-Path C:\LPRdata\data\lpr.db)" | Tee-Object -Append ci_results/installer_test.txt
          if ($p.ExitCode -ne 0 -or $chk -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: lpr-windows-${{ matrix.edition }}
          path: lpr/Output/*
          retention-days: 7
          compression-level: 0
      - name: Publish CI results branch
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          $dst = "$env:RUNNER_TEMP\results"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item -Recurse ci_results\* $dst
          Set-Location $dst
          git init -q -b results
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "LPR CI results run ${{ github.run_number }} windows-${{ matrix.edition }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:$env:TOKEN@github.com/${{ github.repository }}.git" "HEAD:refs/heads/ci-results/lpr-run-${{ github.run_number }}-windows-${{ matrix.edition }}"

  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64
          - os: ubuntu-22.04-arm
            name: linux-arm64
          - os: macos-14
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x64
    name: portable (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: lpr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build + test
        run: |
          mkdir -p ci_results out
          (cd frontend && npm ci --no-audit --no-fund && npm run build)
          python -m pip install --upgrade pip
          pip install -r requirements/runtime.txt -r requirements/dev.txt
          pip freeze > ci_results/lock-${{ matrix.name }}.txt
          python tools/fetch_models.py
          python -m pytest -q -p no:cacheprovider 2>&1 | tee ci_results/pytest-${{ matrix.name }}.txt | tail -5
          test "${PIPESTATUS[0]}" = "0"
          pyinstaller --noconfirm --clean packaging/lpr.spec > ci_results/pyinstaller-${{ matrix.name }}.txt 2>&1 || { tail -60 ci_results/pyinstaller-${{ matrix.name }}.txt; exit 1; }
          ./dist/LPR/LPR --selftest ci_results/selftest-${{ matrix.name }}.json --home "$RUNNER_TEMP/lpr-st"
          head -60 ci_results/selftest-${{ matrix.name }}.json
          tar -C dist -czf "out/LPR-Portable-${APP_VERSION}-${{ matrix.name }}.tar.gz" LPR
          ls -l out | tee ci_results/sizes-${{ matrix.name }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lpr-portable-${{ matrix.name }}
          path: lpr/out/*
          retention-days: 7
          compression-level: 0
      - name: Publish CI results branch
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          dst="$RUNNER_TEMP/results"
          mkdir -p "$dst" && cp -r ci_results/. "$dst"/ 2>/dev/null || true
          cd "$dst"
          git init -q -b results
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "LPR CI results run ${{ github.run_number }} ${{ matrix.name }} (${{ github.sha }})" --allow-empty
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/ci-results/lpr-run-${{ github.run_number }}-${{ matrix.name }}"

  release:
    needs: [windows, portable]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    concurrency:
      group: lpr-release
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lpr-*
          path: dist
          merge-multiple: true
      - name: Release for this build + lpr-latest
        run: |
          set -euo pipefail
          ls -l dist
          # ต้องมีอย่างน้อยตัวติดตั้งรุ่นปกติ ไม่เช่นนั้นไม่เผยแพร่
          test -f "dist/LPR-Setup-${APP_VERSION}.exe"
          tag="lpr-v${APP_VERSION}-build.${{ github.run_number }}"
          url="https://github.com/${GH_REPO}"
          mkdir latest
          for f in dist/*; do cp "$f" "latest/$(basename "$f" | sed "s/-${APP_VERSION}//")"; done
          (cd latest && sha256sum * > SHA256SUMS.txt)
          (cd dist && sha256sum * > SHA256SUMS.txt)
          {
            echo "## LPR บ้าน ${APP_VERSION} (build ${{ github.run_number }})"
            echo
            echo "| ไฟล์ | ใช้กับ |"
            echo "| --- | --- |"
            for f in latest/*; do
              n=$(basename "$f")
              case "$n" in
                LPR-Setup.exe) w="Windows 10/11 64-bit ทุกเครื่อง — **แนะนำ** (ติดตั้ง + Windows service)";;
                LPR-Setup-GPU.exe) w="Windows 10/11 64-bit ที่มีการ์ดจอ NVIDIA/AMD/Intel รองรับ DirectX 12 (หลายกล้อง)";;
                LPR-Portable-windows-x64.zip) w="Windows แบบไม่ต้องติดตั้ง (แตกไฟล์แล้วเปิด LPR.exe)";;
                LPR-Portable-windows-x64-GPU.zip) w="Windows รุ่น GPU แบบไม่ต้องติดตั้ง";;
                LPR-Portable-linux-x64.tar.gz) w="Linux 64-bit (Ubuntu 22.04+ / Debian 12+)";;
                LPR-Portable-linux-arm64.tar.gz) w="Linux ARM64 (Raspberry Pi 5 / mini PC ARM, 64-bit OS)";;
                LPR-Portable-macos-arm64.tar.gz) w="Mac ชิป Apple (M1/M2/M3/M4)";;
                LPR-Portable-macos-x64.tar.gz) w="Mac ชิป Intel";;
                SHA256SUMS.txt) w="ค่า SHA-256 สำหรับตรวจไฟล์";;
                *) w="";;
              esac
              echo "| [${n}](${url}/releases/download/lpr-latest/${n}) ($(du -h "$f" | cut -f1)) | ${w} |"
            done
            echo
            echo "สร้างและทดสอบโดย CI จาก commit \`${GITHUB_SHA}\` — ผลทดสอบอยู่ใน branch \`ci-results/lpr-run-${{ github.run_number }}-*\`"
            echo "ลิงก์ในตารางนี้ (release lpr-latest) จะชี้ไปที่ build ล่าสุดเสมอ"
          } > notes.md
          cat notes.md
          for i in 1 2 3; do
            if gh release view "$tag" > /dev/null 2>&1; then
              gh release upload "$tag" dist/* --clobber && break
            else
              gh release create "$tag" dist/* --target "$GITHUB_SHA" --prerelease \
                --title "LPR บ้าน ${APP_VERSION} build ${{ github.run_number }}" --notes-file notes.md && break
            fi
            echo "สร้าง release ไม่สำเร็จ ลองใหม่ ($i)"; sleep 30
          done
          gh release view "$tag" > /dev/null
          # ถ้า lpr-latest ชี้ไปที่ commit ที่ใหม่กว่าแล้ว (build อื่นเสร็จก่อน) ไม่ย้อนกลับ
          cur=$(gh api "repos/${GH_REPO}/git/refs/tags/lpr-latest" -q .object.sha 2>/dev/null || true)
          if [ -n "$cur" ] && [ "$cur" != "$GITHUB_SHA" ] && \
             [ "$(gh api "repos/${GH_REPO}/compare/${GITHUB_SHA}...${cur}" -q .status 2>/dev/null || true)" = "ahead" ]; then
            echo "lpr-latest ชี้ไปที่ build ที่ใหม่กว่าแล้ว (${cur}) — ไม่อัปเดต"
            exit 0
          fi
          # lpr-latest: ย้าย tag มาที่ commit นี้ แล้วแทนไฟล์ทั้งหมด (ชื่อไฟล์ไม่มีเลขเวอร์ชัน ลิงก์จึงไม่เปลี่ยน)
          if gh api "repos/${GH_REPO}/git/refs/tags/lpr-latest" > /dev/null 2>&1; then
            gh api -X PATCH "repos/${GH_REPO}/git/refs/tags/lpr-latest" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh api -X POST "repos/${GH_REPO}/git/refs" -f ref=refs/tags/lpr-latest -f sha="$GITHUB_SHA" > /dev/null
          fi
          if gh release view lpr-latest > /dev/null 2>&1; then
            gh release edit lpr-latest --title "LPR บ้าน ${APP_VERSION} (ล่าสุด)" --notes-file notes.md --prerelease=false --latest
          else
            gh release create lpr-latest --verify-tag --title "LPR บ้าน ${APP_VERSION} (ล่าสุด)" --notes-file notes.md --latest
          fi
          gh release upload lpr-latest latest/* --clobber
          for old in $(gh release view lpr-latest --json assets -q '.assets[].name'); do
            [ -f "latest/$old" ] || gh release delete-asset lpr-latest "$old" -y
          done
          gh release view lpr-latest --json assets -q '.assets[] | "\(.name) \(.size)"'
